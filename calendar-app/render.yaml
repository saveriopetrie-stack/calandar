services:
  - type: web
    name: calendar-app
    runtime: python
    plan: free
    rootDir: calendar-app
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: CALENDAR_DB
        value: /var/data/calendar.db
    disk:
      name: calendar-data
      mountPath: /var/data
      sizeGB: 1
