# Fly.io app config.
# Run `fly launch` from inside calendar-app/ first — it will offer to
# generate/overwrite this file with your chosen app name and region;
# keep the [mounts]/[http_service] sections below when it does.

app = "CHANGE-ME-unique-app-name"
primary_region = "nrt"

[build]

[env]
  PORT = "8080"

[[mounts]]
  source = "calendar_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
