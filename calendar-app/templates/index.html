<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title data-i18n="app_title">日历 · Calendar</title>
<link rel="stylesheet" href="/static/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>📅</text></svg>">
</head>
<body>

<!-- ══════════════ Top bar ══════════════ -->
<header class="topbar" id="topbar">
  <div class="topbar-left">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 9h18"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/>
        </svg>
      </span>
    </div>
    <nav class="month-nav" aria-label="月份导航">
      <button class="icon-btn" id="btn-prev" title="上一月" data-i18n-title="prev_month" aria-label="上一月">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="month-title-btn" id="month-title" data-i18n-title="switch_month">2026年8月</button>
      <button class="icon-btn" id="btn-next" title="下一月" data-i18n-title="next_month" aria-label="下一月">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </nav>
  </div>
  <div class="topbar-right">
    <div class="menu-wrap">
      <button class="btn btn-primary plus-btn" id="btn-plus" title="新建" data-i18n-title="create" aria-label="新建">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <div class="plus-menu" id="plus-menu" role="menu" hidden>
        <button type="button" class="plus-item" data-action="event">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 9h18"/><path d="M8 14h.01M12 14h.01M16 14h.01"/></svg>
          <span data-i18n="event_title_new">新建事件</span>
        </button>
        <button type="button" class="plus-item" data-action="voice">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3"/></svg>
          <span data-i18n="voice_input">语音添加</span>
        </button>
        <button type="button" class="plus-item" data-action="task">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <span data-i18n="task_title_new">新建任务</span>
        </button>
      </div>
    </div>
    <div class="menu-wrap">
      <button class="icon-btn" id="btn-more" title="更多" data-i18n-title="more" aria-label="更多">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
      </button>
      <div class="plus-menu more-menu" id="more-menu" role="menu" hidden>
        <button type="button" class="plus-item" data-action="lang">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 4 9 15 15 0 0 1-4 9 15 15 0 0 1-4-9 15 15 0 0 1 4-9z"/></svg>
          <span id="more-lang-label" data-i18n="menu_lang">语言</span>
        </button>
        <button type="button" class="plus-item" data-action="theme">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <span data-i18n="menu_theme">主题</span>
        </button>
        <button type="button" class="plus-item" data-action="settings">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span data-i18n="settings_title">设置</span>
        </button>
        <button type="button" class="plus-item" data-action="logout" id="menu-logout" hidden>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          <span data-i18n="logout">退出登录</span>
        </button>
      </div>
    </div>
  </div>
</header>

<!-- ══════════════ Layout ══════════════ -->
<div class="layout">
  <!-- Left sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="mini-cal" id="mini-cal"></div>
    <div class="tasks-panel">
      <div class="tasks-head">
        <h2 data-i18n="tasks_title">今日任务</h2>
        <button class="icon-btn sm" id="btn-add-task" title="添加任务" data-i18n-title="add_task" aria-label="添加任务">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div class="tasks-date" id="tasks-date"></div>
      <ul class="task-list" id="task-list"></ul>
      <div class="tasks-empty" id="tasks-empty" hidden data-i18n="no_tasks">这一天没有任务</div>
    </div>
  </aside>

  <!-- Main calendar -->
  <main class="main">
    <div class="weekday-row" id="weekday-row"></div>
    <div class="month-grid" id="month-grid"></div>
  </main>
</div>

<!-- ══════════════ Event modal ══════════════ -->
<div class="modal-backdrop" id="event-modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="event-modal-title">
    <div class="modal-head">
      <h3 id="event-modal-title" data-i18n="event_title_new">新建事件</h3>
      <button class="icon-btn" data-close aria-label="关闭">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <form id="event-form" autocomplete="off">
      <input type="hidden" id="ev-id">
      <label class="field">
        <span class="field-label" data-i18n="f_title">标题</span>
        <input type="text" id="ev-title" class="input" required data-i18n-ph="f_title_ph">
      </label>
      <div class="field-row">
        <label class="switch-field">
          <input type="checkbox" id="ev-all-day">
          <span class="switch" aria-hidden="true"></span>
          <span class="field-label inline" data-i18n="all_day">全天</span>
        </label>
      </div>
      <div class="field-row" id="ev-start-row">
        <label class="field">
          <span class="field-label" data-i18n="f_start">开始</span>
          <div class="datetime-inputs">
            <input type="date" id="ev-start-date" class="input" required>
            <input type="time" id="ev-start-time" class="input">
          </div>
        </label>
      </div>
      <div class="field-row" id="ev-end-row">
        <label class="field">
          <span class="field-label" data-i18n="f_end">结束</span>
          <div class="datetime-inputs">
            <input type="date" id="ev-end-date" class="input" required>
            <input type="time" id="ev-end-time" class="input">
          </div>
        </label>
      </div>
      <label class="field">
        <span class="field-label" data-i18n="f_location">地点</span>
        <input type="text" id="ev-location" class="input" data-i18n-ph="f_location_ph">
      </label>
      <label class="field">
        <span class="field-label" data-i18n="f_desc">备注</span>
        <textarea id="ev-description" class="input textarea" rows="2" data-i18n-ph="f_desc_ph"></textarea>
      </label>
      <div class="field">
        <span class="field-label" data-i18n="f_color">颜色</span>
        <div class="color-picker" id="ev-colors">
          <button type="button" class="color-swatch" data-color="red" style="--swatch:#ef4444" aria-label="red"></button>
          <button type="button" class="color-swatch" data-color="orange" style="--swatch:#f97316" aria-label="orange"></button>
          <button type="button" class="color-swatch" data-color="yellow" style="--swatch:#eab308" aria-label="yellow"></button>
          <button type="button" class="color-swatch" data-color="green" style="--swatch:#22c55e" aria-label="green"></button>
          <button type="button" class="color-swatch" data-color="teal" style="--swatch:#14b8a6" aria-label="teal"></button>
          <button type="button" class="color-swatch" data-color="blue" style="--swatch:#3b82f6" aria-label="blue"></button>
          <button type="button" class="color-swatch" data-color="indigo" style="--swatch:#6366f1" aria-label="indigo"></button>
          <button type="button" class="color-swatch" data-color="purple" style="--swatch:#a855f7" aria-label="purple"></button>
          <button type="button" class="color-swatch" data-color="pink" style="--swatch:#ec4899" aria-label="pink"></button>
          <button type="button" class="color-swatch" data-color="gray" style="--swatch:#6b7280" aria-label="gray"></button>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-danger ghost" id="ev-delete" hidden data-i18n="delete">删除</button>
        <div class="modal-foot-right">
          <button type="button" class="btn" data-close data-i18n="cancel">取消</button>
          <button type="submit" class="btn btn-primary" id="ev-save" data-i18n="save">保存</button>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- ══════════════ Task modal ══════════════ -->
<div class="modal-backdrop" id="task-modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="task-modal-title">
    <div class="modal-head">
      <h3 id="task-modal-title" data-i18n="task_title_new">新建任务</h3>
      <button class="icon-btn" data-close aria-label="关闭">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <form id="task-form" autocomplete="off">
      <input type="hidden" id="tk-id">
      <label class="field">
        <span class="field-label" data-i18n="f_title">标题</span>
        <input type="text" id="tk-title" class="input" required data-i18n-ph="f_title_ph">
      </label>
      <div class="segmented" id="tk-type" role="radiogroup">
        <button type="button" class="segment active" data-value="daily" data-i18n="task_daily">每日任务</button>
        <button type="button" class="segment" data-value="one_time" data-i18n="task_onetime">一次性</button>
      </div>
      <div class="field-row">
        <label class="field">
          <span class="field-label" data-i18n="f_time">时间（可选）</span>
          <input type="time" id="tk-time" class="input">
        </label>
        <label class="field" id="tk-due-field">
          <span class="field-label" data-i18n="f_due">截止日期</span>
          <input type="date" id="tk-due" class="input">
        </label>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-danger ghost" id="tk-delete" hidden data-i18n="delete">删除</button>
        <div class="modal-foot-right">
          <button type="button" class="btn" data-close data-i18n="cancel">取消</button>
          <button type="submit" class="btn btn-primary" id="tk-save" data-i18n="save">保存</button>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- ══════════════ Settings modal ══════════════ -->
<div class="modal-backdrop" id="settings-modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="modal-head">
      <h3 id="settings-title" data-i18n="settings_title">设置</h3>
      <button class="icon-btn" data-close aria-label="关闭">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <form id="settings-form" autocomplete="off">
      <div class="field">
        <span class="field-label">DeepSeek API Key</span>
        <div class="key-input-wrap">
          <input type="password" id="set-key" class="input" placeholder="sk-..." data-i18n-ph="api_key_ph">
          <button type="button" class="icon-btn sm" id="set-key-toggle" title="显示/隐藏" aria-label="显示/隐藏">
            <svg id="set-key-eye" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <p class="hint" id="set-key-status" data-i18n="api_key_hint">在 platform.deepseek.com 申请 API key，配置后语音/文字输入将由 AI 自动解析并填写事件。</p>
      </div>
      <div class="field-row">
        <label class="field">
          <span class="field-label" data-i18n="f_base_url">接口地址（可选）</span>
          <input type="text" id="set-base-url" class="input" placeholder="https://api.deepseek.com">
        </label>
        <label class="field">
          <span class="field-label" data-i18n="f_model">模型（可选）</span>
          <input type="text" id="set-model" class="input" placeholder="deepseek-chat">
        </label>
      </div>
      <div class="field-row">
        <label class="field">
          <span class="field-label" data-i18n="f_language">界面语言</span>
          <select id="set-language" class="input">
            <option value="zh">中文</option>
            <option value="en">English</option>
          </select>
        </label>
        <label class="field">
          <span class="field-label" data-i18n="f_theme">主题</span>
          <select id="set-theme" class="input">
            <option value="auto" data-i18n="theme_auto">跟随系统</option>
            <option value="light" data-i18n="theme_light">浅色</option>
            <option value="dark" data-i18n="theme_dark">深色</option>
          </select>
        </label>
      </div>
      <div class="modal-foot">
        <div class="modal-foot-right">
          <button type="button" class="btn" data-close data-i18n="cancel">取消</button>
          <button type="submit" class="btn btn-primary" data-i18n="save">保存</button>
        </div>
      </div>
    </form>

    <div class="modal-divider"></div>

    <form id="security-form" autocomplete="off">
      <div class="field">
        <span class="field-label security-label">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <span data-i18n="security_title">访问密码</span>
        </span>
        <p class="hint" id="security-status"></p>
      </div>
      <div class="field-row">
        <label class="field" id="security-current-field" hidden>
          <span class="field-label" data-i18n="f_current_password">当前密码</span>
          <input type="password" id="sec-current" class="input" autocomplete="current-password">
        </label>
        <label class="field">
          <span class="field-label" data-i18n="f_new_password">新密码</span>
          <input type="password" id="sec-new" class="input" autocomplete="new-password" data-i18n-ph="f_new_password_ph">
        </label>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-danger ghost" id="sec-disable" hidden data-i18n="security_disable">关闭密码保护</button>
        <div class="modal-foot-right">
          <button type="submit" class="btn btn-primary" data-i18n="security_save">保存密码</button>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- ══════════════ Voice / AI modal ══════════════ -->
<div class="modal-backdrop" id="voice-modal" hidden>
  <div class="modal voice-modal" role="dialog" aria-modal="true" aria-labelledby="voice-title">
    <div class="modal-head">
      <h3 id="voice-title" data-i18n="voice_title">语音添加事件</h3>
      <button class="icon-btn" data-close aria-label="关闭">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="voice-stage" id="voice-stage">
      <button class="mic-btn" id="mic-btn" aria-label="开始说话">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3"/>
        </svg>
      </button>
      <p class="voice-hint" id="voice-hint" data-i18n="voice_hint">点击麦克风，说出你想添加的事件或任务</p>
      <p class="voice-transcript" id="voice-transcript" hidden></p>
      <div class="voice-examples" id="voice-examples">
        <p class="voice-examples-label" data-i18n="voice_examples">试试说：</p>
        <div class="voice-example-chips">
          <button type="button" class="chip" data-example="明天下午3点和张三开产品会议，地点在公司会议室">明天下午3点和张三开产品会议</button>
          <button type="button" class="chip" data-example="本周五晚上7点去看电影">本周五晚上7点去看电影</button>
          <button type="button" class="chip" data-example="每天早上8点跑步半小时">每天早上8点跑步半小时</button>
        </div>
      </div>
    </div>

    <div class="voice-input-row">
      <input type="text" id="voice-text" class="input" placeholder="" data-i18n-ph="voice_text_ph">
      <button class="btn btn-primary" id="btn-parse" data-i18n="parse">AI 解析</button>
    </div>

    <div class="parse-result" id="parse-result" hidden></div>
  </div>
</div>

<!-- ══════════════ Month picker ══════════════ -->
<div class="month-picker" id="month-picker" hidden>
  <div class="mp-head">
    <button class="icon-btn sm" id="mp-prev-year" title="上一年" aria-label="上一年">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span class="mp-year" id="mp-year">2026</span>
    <button class="icon-btn sm" id="mp-next-year" title="下一年" aria-label="下一年">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </div>
  <div class="mp-months" id="mp-months"></div>
  <button type="button" class="mp-today" id="mp-today" data-i18n="back_today">回到今天</button>
</div>

<!-- ══════════════ Day popover ══════════════ -->
<div class="day-popover" id="day-popover" hidden>
  <div class="day-popover-head">
    <span class="dp-grip" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></svg>
    </span>
    <h3 id="dp-title"></h3>
    <button class="icon-btn sm" id="dp-close" aria-label="关闭">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <button class="btn btn-add-dp" id="dp-add">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    <span data-i18n="add_event">添加事件</span>
  </button>
  <div class="dp-list" id="dp-list"></div>
  <div class="dp-empty" id="dp-empty" hidden data-i18n="no_events">这一天没有事件</div>
</div>

<!-- ══════════════ Confirm + toast ══════════════ -->
<div class="modal-backdrop" id="confirm-modal" hidden>
  <div class="modal confirm-modal" role="alertdialog" aria-modal="true">
    <p class="confirm-text" id="confirm-text"></p>
    <div class="modal-foot confirm-foot">
      <button type="button" class="btn" id="confirm-no" data-i18n="cancel">取消</button>
      <button type="button" class="btn btn-danger" id="confirm-yes" data-i18n="confirm">确认</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toast-wrap" aria-live="polite"></div>

<!-- Mobile tab bar -->
<nav class="mobile-tabs" id="mobile-tabs">
  <button class="mobile-tab active" data-tab="calendar">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 9h18"/></svg>
    <span data-i18n="tab_calendar">日历</span>
  </button>
  <button class="mobile-tab" data-tab="tasks">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    <span data-i18n="tab_tasks">任务</span>
  </button>
</nav>

<script src="/static/js/i18n.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/app.js"></script>
<script src="/static/js/calendar.js"></script>
<script src="/static/js/events.js"></script>
<script src="/static/js/tasks.js"></script>
<script src="/static/js/voice.js"></script>
</body>
