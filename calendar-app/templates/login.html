<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title data-i18n="app_title">日历 · Calendar</title>
<link rel="stylesheet" href="/static/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>📅</text></svg>">
</head>
<body class="login-body">

<div class="login-wrap">
  <div class="login-card">
    <div class="login-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 9h18"/>
        <path d="M12 13a2 2 0 1 0-1.98-2.28"/><path d="M12 13v3"/>
      </svg>
    </div>
    <h1 class="login-title" data-i18n="login_title">需要密码</h1>
    <p class="login-sub" data-i18n="login_sub">请输入访问密码以继续</p>

    <form id="login-form" autocomplete="off">
      <label class="field">
        <span class="field-label" data-i18n="login_password">密码</span>
        <div class="key-input-wrap">
          <input type="password" id="login-password" class="input" autofocus required data-i18n-ph="login_password_ph">
          <button type="button" class="icon-btn sm" id="login-eye" aria-label="显示/隐藏">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </label>
      <p class="hint err" id="login-error" hidden></p>
      <button type="submit" class="btn btn-primary login-submit" id="login-submit" data-i18n="login_submit">登录</button>
    </form>
  </div>
</div>

<script src="/static/js/i18n.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/login.js"></script>
</body>
</html>
